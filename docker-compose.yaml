# Basic Airflow cluster configuration for CeleryExecutor with Redis and PostgreSQL.
#
# WARNING: This configuration is for local development. Do not use it in a production deployment.
#
# This configuration supports basic configuration using environment variables or an .env file
# The following variables are supported:
#
# AIRFLOW_IMAGE_NAME           - Docker image name used to run Airflow.
#                                Default: apache/airflow:3.1.6
# AIRFLOW_UID                  - User ID in Airflow containers
#                                Default: 50000
# AIRFLOW_PROJ_DIR             - Base path to which all the files will be volumed.
#                                Default: .
# Those configurations are useful mostly in case of standalone testing/running Airflow in test/try-out mode
#
# _AIRFLOW_WWW_USER_USERNAME   - Username for the administrator account (if requested).
#                                Default: airflow
# _AIRFLOW_WWW_USER_PASSWORD   - Password for the administrator account (if requested).
#                                Default: airflow
# _PIP_ADDITIONAL_REQUIREMENTS - Additional PIP requirements to add when starting all containers.
#                                Use this option ONLY for quick checks. Installing requirements at container
#                                startup is done EVERY TIME the service is started.
#                                A better way is to build a custom image or extend the official image
#                                as described in https://airflow.apache.org/docs/docker-stack/build.html.
#                                Default: ''
#
# Feel free to modify this file to suit your needs.
---
name: MLOps-CoreLab

x-airflow-common:
  &airflow-common
  # Custom Airflow image with Docker CLI for model deployment
  # Build with: docker-compose build
  build:
    context: ./infrastructure/airflow
    dockerfile: Dockerfile
  image: mlops-corelab-airflow:latest
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    # yamllint disable rule:line-length
    # Use simple http server on scheduler for health checks
    # See https://airflow.apache.org/docs/apache-airflow/stable/administration-and-deployment/logging-monitoring/check-health.html#scheduler-health-check-server
    # yamllint enable rule:line-length
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # Python packages are installed in the custom Dockerfile
    _PIP_ADDITIONAL_REQUIREMENTS: ''
    # The following line can be used to set a custom config file, stored in the local config folder
    AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
  volumes:
    - ${AIRFLOW_PROJ_DIR:-./src}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-./src}/utils:/opt/airflow/utils
    - ${AIRFLOW_PROJ_DIR:-./src}/config.model.json:/opt/airflow/config.model.json
    - ${AIRFLOW_PROJ_DIR:-./logs/airflow_logs}:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-./infrastructure/airflow/config}:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-./infrastructure/airflow/scripts}:/opt/airflow/scripts
    - airflow-plugins:/opt/airflow/plugins
    - ${AIRFLOW_PROJ_DIR:-.}/data:/opt/airflow/data
    - ${AIRFLOW_PROJ_DIR:-.}/artifacts:/mlflow
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy
    mlflow:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-postgresdb}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # ---- pgAdmin (Database Explorer) ----
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - ./infrastructure/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./infrastructure/pgadmin/.pgpass:/var/lib/pgadmin/.pgpass:ro
    ports:
      - "5050:80"
    restart: unless-stopped

  redis:
    # Redis is limited to 7.2-bookworm due to licencing change
    # https://redis.io/blog/redis-adopts-dual-source-available-licensing/
    image: redis:7.2-bookworm
    container_name: redis
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: always

  airflow-apiserver:
    <<: *airflow-common
    container_name: airflow-apiserver
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow-dag-processor
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    container_name: airflow-worker
    command: celery worker
    healthcheck:
      # yamllint disable rule:line-length
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      <<: *airflow-common-env
      # Required to handle warm shutdown of the celery workers properly
      # See https://airflow.apache.org/docs/docker-stack/entrypoint.html#signal-propagation
      DUMB_INIT_SETSID: "0"
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-apiserver:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    container_name: airflow-triggerer
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - /opt/airflow/scripts/init-airflow.sh
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    user: "0:0"

  airflow-cli:
    <<: *airflow-common
    container_name: airflow-cli
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    # Workaround for entrypoint issue. See: https://github.com/apache/airflow/issues/16252
    command:
      - bash
      - -c
      - airflow
    depends_on:
      <<: *airflow-common-depends-on

  # You can enable flower by adding "--profile flower" option e.g. docker-compose --profile flower up
  # or by explicitly targeted on the command line e.g. docker-compose up flower.
  # See: https://docs.docker.com/compose/profiles/
  flower:
    <<: *airflow-common
    container_name: flower
    command: celery flower
    profiles:
      - flower
    ports:
      - "5555:5555"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5555/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # ---- JupyterLab ----
  # Documentation: https://jupyter-docker-stacks.readthedocs.io/en/latest/using/common.html
  #                https://jupyter-docker-stacks.readthedocs.io/en/latest/using/running.html
  jupyterlab:
    build:
      context: ./infrastructure/jupyterlabs
      dockerfile: Dockerfile
    container_name: jupyterlab
    environment:
      JUPYTER_TOKEN: ""
      NB_UID: ${JUPYTER_UID:-1000}
      NB_GID: ${JUPYTER_GID:-100}
    volumes:
      - ./src/notebooks:/home/jovyan/notebooks
      - ./src/dags:/home/jovyan/dags
      - ./data:/home/jovyan/data
    ports:
      - "8888:8888"
    command: start-notebook.sh --NotebookApp.allow_origin='*' --NotebookApp.base_url=/ --NotebookApp.token='' --NotebookApp.password=''
    restart: unless-stopped

  # ---- MLflow (MLOps) ----
  # Documentation: https://mlflow.org/docs/latest/ml/
  #                https://mlflow.org/docs/latest/docker.html
  mlflow:
      image: ghcr.io/mlflow/mlflow:v3.2.0
      container_name: mlflow
      depends_on:
        postgres:
          condition: service_healthy
      environment:
        MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://${MLFLOW_DB_USER:-mlflow}:${MLFLOW_DB_PASSWORD:-mlflow_pwd}@postgres:5432/${MLFLOW_DB_NAME:-mlflow}
        MLFLOW_ARTIFACT_ROOT: /mlflow/artifacts
      volumes:
        - ./artifacts:/mlflow/artifacts
        - ./data:/opt/airflow/data
      ports:
        - "5000:5000"
      entrypoint: >
        sh -c "pip install psycopg2-binary &&
        mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri postgresql+psycopg2://${MLFLOW_DB_USER:-mlflow}:${MLFLOW_DB_PASSWORD:-mlflow_pwd}@postgres:5432/${MLFLOW_DB_NAME:-mlflow}
        --default-artifact-root /mlflow/artifacts"
      healthcheck:
        test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\" || exit 1"]
        interval: 30s
        timeout: 10s
        retries: 3
      restart: unless-stopped

  # ---- Model Serving API ----
  # Serves champion models from MLflow via REST API
  model-serve:
    build:
      context: ./infrastructure/model-serve
      dockerfile: Dockerfile
    container_name: model-serve
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      CHAMPION_ALIAS: champion
    volumes:
      - ./artifacts/artifacts:/mlflow/artifacts
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # ---- Kestra (Workflow Orchestration) ----
  # Documentation: https://kestra.io/docs
  kestra:
    image: kestra/kestra:latest
    container_name: kestra
    command: server standalone
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/${KESTRA_DB_NAME:-kestra}
            driverClassName: org.postgresql.Driver
            username: ${KESTRA_DB_USER:-kestra}
            password: ${KESTRA_DB_PASSWORD:-kestra_pwd}
        kestra:
          server:
            basic-auth:
              enabled: false
          security:
            type: basic
            basic:
              enabled: false
          anonymous:
            enabled: true
          tutorialFlows:
            enabled: false
          repository:
            type: postgres
          source:
            type: local
            local:
              path: /app/flows
              enabled: true
          storage:
            type: local
            local:
              base-path: /app/storage
          queue:
            type: postgres
          tasks:
            tmp-dir:
              path: /app/tmp
          plugins:
            repositories:
              central:
                url: https://repo.maven.apache.org/maven2/
      # API Keys for marketsense flows (accessible via {{ envs.VAR_NAME }})
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-WJRJ9R2L6F6A5AN5}
      MASSIVE_API_KEY: ${MASSIVE_API_KEY:-EdZwnEDxaFTNLNSpSAH4FSMbKponcXIw}
    volumes:
      - kestra-data:/app/storage
      - ./data:/app/data
      - ./flows:/app/flows
      - /var/run/docker.sock:/var/run/docker.sock
      - kestra-tmp:/app/tmp
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    restart: unless-stopped

  # ---- MLOps Dashboard (.NET Blazor Server) ----
  # Replaces the static homepage with a dynamic experiment management dashboard
  mlops-dashboard:
    build:
      context: ./infrastructure/dashboard
      dockerfile: Dockerfile
    container_name: mlops-dashboard
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:3001
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=mlops_dashboard;Username=dashboard;Password=dashboard_pwd
      Mlflow__BaseUrl: http://mlflow:5000
      Airflow__BaseUrl: http://airflow-apiserver:8080
      DagOutput__Path: /app/dags
    volumes:
      - ./src/dags:/app/dags:rw
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ---- Homepage (Service Dashboard) - DEPRECATED ----
  # Kept for reference, will be removed once mlops-dashboard is fully operational
  # Documentation: https://gethomepage.dev/configs/
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    ports:
      - "3000:3000"
    volumes:
      - ./infrastructure/homepage:/app/config
      - ./logs/homepage_logs:/app/logs
    restart: unless-stopped
    profiles:
      - legacy  # Only starts with: docker-compose --profile legacy up

volumes:
  postgres-data:
  airflow-plugins:
  kestra-data:
  kestra-tmp: